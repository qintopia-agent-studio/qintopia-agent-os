name: qintopia-tools
label: Qintopia Tools
kind: standalone
version: 0.1.0
description: >
  Hermes-native Qintopia knowledge, GIS, controlled complaint workflow, and Xiaoqin
  sales/customer workflow tools backed by WenYuanGe knowledge snapshot indexes and
  Qintopia Agent OS guardrails.
author: Qintopia
hooks:
  - pre_gateway_dispatch
provides_tools:
  - qintopia_kb_search
  - qintopia_gis_location_lookup
  - qintopia_wenyuange_lookup
  - qintopia_weather_lookup
  - qintopia_daily_digest_publish
  - qintopia_xiaoman_activity_record_get
  - qintopia_xiaoman_activity_list_by_date
  - qintopia_xiaoman_activity_announcement_prepare
  - qintopia_xiaoman_activity_text_group_message_request_prepare
  - qintopia_xiaoman_public_reply_rewrite
  - qintopia_xiaoman_activity_status_update
  - qintopia_xiaoman_activity_gap_update
  - qintopia_xiaoman_activity_phase_update
  - qintopia_xiaoman_activity_promotion_details_update
  - qintopia_xiaoman_activity_handoff_create
  - qintopia_xiaoman_activity_promotion_review_draft
  - qintopia_xiaoman_activity_material_summary
  - qintopia_xiaoman_poster_production_request
  - qintopia_xiaoman_poster_workflow_status
  - qintopia_dify_dataset_list
  - qintopia_dify_dataset_get
  - qintopia_dify_knowledge_retrieve
  - qintopia_dify_document_list
  - qintopia_dify_document_get
  - qintopia_dify_indexing_status_get
  - qintopia_dify_segment_list
  - qintopia_dify_segment_get
  - qintopia_complaint_intake_create
  - qintopia_complaint_intake_update
  - qintopia_complaint_followup_send
  - qintopia_external_product_kb_search
  - qintopia_public_case_search
  - qintopia_customer_context_lookup
  - qintopia_lead_capture
  - qintopia_proposal_outline_generate
  - qintopia_demo_script_generate
  - qintopia_external_disclosure_filter
  - qintopia_conversation_summary
optional_env:
  - name: QINTOPIA_KB_INDEX_DIR
    description: "Path to Qintopia knowledge indexes"
    prompt: "Qintopia KB index directory"
    password: false
  - name: QINTOPIA_DIFY_KB_BASE_URL
    description: "Dify Knowledge API base URL, ending in /v1"
    prompt: "Dify Knowledge API base URL"
    password: false
  - name: QINTOPIA_DIFY_KB_API_KEY
    description: "Dify Knowledge Service API key"
    prompt: "Dify Knowledge Service API key"
    password: true
  - name: QINTOPIA_DIFY_ALLOWED_DATASET_IDS
    description: "Optional comma-separated Dify dataset id allowlist"
    prompt: "Allowed Dify dataset ids"
    password: false
  - name: QINTOPIA_DIFY_LOOKUP_DATASET_ID
    description: "Optional Dify dataset id for qintopia_wenyuange_lookup"
    prompt: "Dify lookup dataset id"
    password: false
  - name: QINTOPIA_PROFILE_ID
    description: "Active Qintopia profile id for profile-scoped tool registration"
    prompt: "Qintopia profile id"
    password: false
  - name: QINTOPIA_DIFY_RAW_TOOLS_ENABLE
    description: "Set to 1 only for wenyuange to expose raw qintopia_dify_* read tools"
    prompt: "Enable raw Dify read tools"
    password: false
  - name: QINTOPIA_XIAOMAN_POSTER_REVIEW_HOOK_ENABLE
    description: "Enable deterministic Xiaoman Feishu poster review card forwarding"
    prompt: "Enable Xiaoman poster review hook"
    password: false
  - name: QINTOPIA_XIAOMAN_FEISHU_CALLBACK_ENCRYPT_KEY
    description: "Shared key for the local authenticated poster review callback ingress"
    prompt: "Xiaoman poster review callback key"
    password: true
  - name: QINTOPIA_XIAOMAN_FEISHU_INGRESS_HOOK_ENABLE
    description:
      "Enable authenticated Xiaoman Feishu message ingress before model dispatch"
    prompt: "Enable Xiaoman Feishu message ingress"
    password: false
  - name: QINTOPIA_XIAOMAN_FEISHU_INGRESS_HMAC_KEY
    description: "Dedicated HMAC key for local authenticated Feishu message ingress"
    prompt: "Xiaoman Feishu message ingress key"
    password: true
  - name: QINTOPIA_XIAOMAN_FEISHU_BOT_OPEN_ID
    description: "Exact Xiaoman Feishu Bot open id used to verify group mentions"
    prompt: "Xiaoman Feishu Bot open id"
    password: false
  - name: QINTOPIA_XIAOMAN_FEISHU_INTERNAL_GROUP_ENABLED
    description: "Keep at 0 until the separately approved internal-group activation"
    prompt: "Enable Xiaoman internal-group ingress"
    password: false

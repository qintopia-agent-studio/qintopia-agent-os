id: workflows/xiaoman-daily-case-report
type: workflow
name: Xiaoman Daily Community Case-File Report
owner: PatrickLiveCool
status: draft
risk_level: medium
description:
  Deterministic daily case-file poster generator for Xiaoman community groups. It reads
  the last 24 hours of QiWe group messages from the Qintopia message store, clusters
  topics into playful "cases", picks active "suspects", renders a PNG poster, and
  produces a human-review draft. It never sends.
source:
  path: workflows/xiaoman-daily-case-report/daily_case_report.py
  reference: standalone Python script with optional Postgres read-through
  disposition: adopt
production_boundary:
  external_sends: false
  database_writes: false
  runtime_profile: false
  secrets: true
validation:
  commands:
    - pnpm workflows:check
    - "python3 workflows/xiaoman-daily-case-report/daily_case_report.py --dry-run
      --render html"
dependencies:
  - skills/qiwe
  - runtime/postgres
  - agents/xiaoman
tags:
  - workflow
  - xiaoman
  - daily-report
  - community
  - image
next_actions:
  - Keep status as draft until the visual style, read-through path, and render
    dependencies are reviewed and accepted.
  - Add psycopg, Playwright, and Chromium through a reviewed runtime packaging boundary
    before enabling production PNG/database runs; do not hand-install them on servers.
  - Add reviewed deploy/runner unit templates, install logic, rollback logic, bundle
    inclusion, and deploy-contract checks before switching to active or installing a
    systemd timer. The rendered unit must use an absolute reviewed Python interpreter
    with dependency preflight evidence. Do not activate through hand-copied units or
    server-local edits.
  - The script only drafts; a human must confirm before any QiWe group send.

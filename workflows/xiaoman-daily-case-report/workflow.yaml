id: workflows/xiaoman-daily-case-report
type: workflow
name: Xiaoman Daily Community Case-File Report
owner: PatrickLiveCool
status: draft
risk_level: high
description:
  Deterministic daily case-file poster generator for Xiaoman community groups. The
  production target is daily automatic publication through the reviewed QiWe image-send
  boundary without per-day human confirmation.
source:
  path: workflows/xiaoman-daily-case-report/daily_case_report.py
  reference: standalone Python script with optional Postgres read-through
  disposition: adopt
production_boundary:
  external_sends: true
  database_writes: true
  runtime_profile: false
  secrets: true
validation:
  commands:
    - pnpm workflows:check
    - "python3 workflows/xiaoman-daily-case-report/daily_case_report.py --dry-run
      --render html"
dependencies:
  - skills/qiwe
  - runtime/postgres
  - runtime/sidecar
  - agents/xiaoman
tags:
  - workflow
  - xiaoman
  - daily-report
  - community
  - image
next_actions:
  - Add psycopg, Playwright, and Chromium through a reviewed runtime packaging boundary
    before enabling production JPEG/database runs; do not hand-install them on servers.
  - Keep the reviewed render/upload entrypoint
    `xiaoman-daily-case-report-auto-publish-worker.sh` in the release bundle so the
    local JPEG becomes a stable HTTPS artifact URI before publish creation.
  - Production publication must use the reviewed QiWe image-send adapter branch for
    `workflow_type=daily_case_report`; do not add a Python QiWe sender or send from a
    local image path.
  - Activate only through
    `activate-xiaoman-daily-case-report-auto-publish-production.sh`; rollback only
    through `rollback-xiaoman-daily-case-report-auto-publish-production.sh`.
  - Keep status draft until production observation proves the daily timer, artifact
    binding, QiWe upload/callback/send, idempotency, and rollback evidence.

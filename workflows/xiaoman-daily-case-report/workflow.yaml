id: workflows/xiaoman-daily-case-report
type: workflow
name: Xiaoman Wx-Cli Style Daily Report
owner: PatrickLiveCool
status: draft
risk_level: medium
description:
  Wx-cli inspired daily report generator for Xiaoman community groups. It reads the
  latest QiWe group messages, builds storyline-first daily drafts, creates
  stable-identity character sketches from current messages plus long-term creative
  profile signals, renders a group-facing image, and writes a private review bundle.
source:
  path: workflows/xiaoman-daily-case-report/daily_case_report.py
  reference:
    standalone Python script with optional Postgres read-through and psql fallback
  disposition: adopt
production_boundary:
  external_sends: false
  database_writes: false
  runtime_profile: false
  secrets: true
  group_deliverable: image
  pdf_default_delivery: false
validation:
  commands:
    - "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s
      workflows/xiaoman-daily-case-report/tests -v"
    - "python3 workflows/xiaoman-daily-case-report/daily_case_report.py --dry-run
      --render html --output-dir /private/tmp/xiaoman-daily-report-preview"
dependencies:
  - skills/qiwe
  - runtime/postgres
  - agents/xiaoman
tags:
  - workflow
  - xiaoman
  - daily-report
  - community
  - image
  - wx-cli-style
next_actions:
  - Keep status as draft until the reviewed upload/auto-publish chain consumes the
    generated image and sanitized evidence only.
  - Keep PDF as optional archive/review output if added later; do not make it the group
    default.

id: workflows/resident-welcome
type: workflow
name: Resident Welcome V1
owner: PatrickLiveCool
status: draft
risk_level: high
description:
  Governed person, application, stay and membership convergence with durable delivery
  receipts.
source:
  path: runtime/sidecar/src/resident_welcome
  reference: current-monorepo
  disposition: adopt
production_boundary:
  external_sends: false
  database_writes: true
  runtime_profile: false
  secrets: false
validation:
  commands:
    - cargo test --manifest-path runtime/sidecar/Cargo.toml resident_welcome
    - pnpm workflows:check
    - pnpm check:pr:heavy
dependencies:
  - runtime/sidecar
  - runtime/postgres
  - agents/silaoshi
  - agents/erhua
  - agents/huabaosi
tags:
  - workflow
  - identity
  - resident-welcome
next_actions:
  - Complete owner acceptance of the combined local foundation and welcome UI.
  - Audit and migrate the legacy renderer after read-only source access is restored.
  - Production deployment and channel activation require separate authorization.

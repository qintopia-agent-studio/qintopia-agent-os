id: workflows/erhua-morning-brief
type: workflow
name: Erhua Morning Brief
owner: PatrickLiveCool
status: adopting
risk_level: high
description:
  Daily morning Erhua text draft that combines today's Xiaoman activity preview with
  QunMind public-source AI news. On Sunday morning, zero publishable Xiaoman activities
  trigger a second collection prompt after the Saturday reminder. Hermes cron owns the
  recurrence; the release-managed worker can auto-publish the reviewed text to QiWe only
  when explicit production auto-publish and QiWe text-send gates are enabled.
source:
  path: workflows/erhua-morning-brief/morning_brief.py
  reference: Xiaoman same_day_preview plus QunMind daily-report --public-only
  disposition: adopt
production_boundary:
  external_sends: true
  database_writes: true
  runtime_profile: false
  secrets: true
validation:
  commands:
    - pnpm workflows:check
    - PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s
      workflows/erhua-morning-brief/tests -v
dependencies:
  - skills/qintopia-tools
  - runtime/sidecar
  - agents/erhua
  - agents/xiaoman
  - qunmind
tags:
  - workflow
  - erhua
  - xiaoman
  - morning-brief
  - ai-news
next_actions:
  - Move to active only after production observation proves the reviewed Hermes cron and
    Erhua/QiWe text-send boundary evidence.
  - Install the planned 08:10 Asia/Shanghai schedule only through the reviewed Hermes
    cron apply script with observation and rollback evidence; do not hand-copy a cron,
    hot-edit live jobs.json, or hot-edit production units.

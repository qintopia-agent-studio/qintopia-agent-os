id: workflows/silaoshi-daily-ops
type: workflow
name: Silaoshi Daily Ops
owner: PatrickLiveCool
status: adopting
risk_level: high
description:
  Si Laoshi daily operations workflow for SOP follow-up, activity review, service
  tracking, and operating summaries.
source:
  path: agents/silaoshi
  reference: current-monorepo
  disposition: template
production_boundary:
  external_sends: true
  database_writes: true
  runtime_profile: true
  secrets: true
validation:
  commands:
    - pnpm workflows:check
dependencies:
  - agents/silaoshi
  - runtime/postgres
  - mcp/context-server
tags:
  - workflow
  - silaoshi
  - daily-ops
next_actions:
  - Deploy the durable script-action bridge in shadow mode and verify accepted,
    duplicate, success, failure, timeout, and notification evidence.
  - Replace the legacy Hermes script_action route only after the bridge service is
    healthy and the rollback backup is present.

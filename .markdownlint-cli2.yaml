config:
  default: true
  MD013:
    line_length: 120
    code_blocks: false
    tables: false
  MD024:
    siblings_only: true
  MD033: false
globs:
  - "**/*.md"
ignores:
  - ".local-testing"
  - ".local-workspace"
  - ".worktrees"
  - "node_modules"
  - ".pnpm-store"
  - ".git"
  - ".workbuddy"
  - "dist"
  - "CHANGELOG.md"

name: Retire Production Legacy Crons

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Current production release SHA to bind legacy cron retirement to.
        required: true
        type: string
      legacy_cron_retirement_targets:
        description: >-
          Comma-separated fixed targets: erhua-legacy-cron,xiaoman-legacy-cron.
        required: true
        default: erhua-legacy-cron,xiaoman-legacy-cron
        type: string
      notes:
        description: Operator notes for the legacy cron retirement request.
        required: false
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.29.2"
  TENCENT_COS_BUCKET:
    ${{ vars.TENCENT_COS_BUCKET || 'qintopia-agent-os-artifacts-1305166808' }}
  TENCENT_COS_REGION: ${{ vars.TENCENT_COS_REGION || 'ap-shanghai' }}
  TENCENT_COS_ENDPOINT: ${{ vars.TENCENT_COS_ENDPOINT || '' }}
  WAIT_FOR_SERVER_DEPLOY_RESULT: ${{ vars.WAIT_FOR_SERVER_DEPLOY_RESULT || 'false' }}

jobs:
  request-retirement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve legacy cron retirement inputs
        id: resolve
        shell: bash
        env:
          INPUT_RELEASE_SHA: ${{ github.event.inputs.release_sha || '' }}
          INPUT_LEGACY_CRON_RETIREMENT_TARGETS:
            ${{ github.event.inputs.legacy_cron_retirement_targets || '' }}
          INPUT_NOTES: ${{ github.event.inputs.notes || '' }}
        run: |
          set -euo pipefail

          require_single_line() {
            local name="$1"
            local value="$2"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "${name} must be a single-line value." >&2
              exit 2
            fi
          }

          normalize_csv_allowlist() {
            local name="$1"
            local value="$2"
            local allowed_csv="$3"
            require_single_line "$name" "$value"

            local -a allowed
            local -a parts
            local -a normalized
            local item
            local candidate
            local matched
            local duplicate
            IFS=',' read -r -a allowed <<< "$allowed_csv"
            IFS=',' read -r -a parts <<< "$value"

            if [[ "${#parts[@]}" -eq 0 ]]; then
              echo "${name} must not be empty." >&2
              exit 2
            fi

            for item in "${parts[@]}"; do
              item="$(printf '%s' "$item" | xargs)"
              if [[ -z "$item" ]]; then
                echo "${name} must not contain empty entries." >&2
                exit 2
              fi

              matched=false
              for candidate in "${allowed[@]}"; do
                if [[ "$item" == "$candidate" ]]; then
                  matched=true
                  break
                fi
              done
              if [[ "$matched" != "true" ]]; then
                echo "${name} contains unsupported entry: ${item}" >&2
                exit 2
              fi

              duplicate=false
              for candidate in "${normalized[@]:-}"; do
                if [[ "$item" == "$candidate" ]]; then
                  duplicate=true
                  break
                fi
              done
              if [[ "$duplicate" == "true" ]]; then
                echo "${name} contains duplicate entry: ${item}" >&2
                exit 2
              fi

              normalized+=("$item")
            done

            local joined
            joined="$(IFS=','; printf '%s' "${normalized[*]}")"
            printf '%s' "$joined"
          }

          release_sha="$INPUT_RELEASE_SHA"
          require_single_line release_sha "$release_sha"
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a lowercase 40-character git SHA." >&2
            exit 2
          fi
          git fetch --no-tags origin master
          git cat-file -e "${release_sha}^{commit}"
          git merge-base --is-ancestor "$release_sha" origin/master

          legacy_cron_retirement_targets="$(normalize_csv_allowlist \
            legacy_cron_retirement_targets \
            "$INPUT_LEGACY_CRON_RETIREMENT_TARGETS" \
            "erhua-legacy-cron,xiaoman-legacy-cron")"

          notes_delimiter="legacy_cron_retirement_notes_$(uuidgen | tr '[:upper:]' '[:lower:]')"
          {
            echo "release-sha=${release_sha}"
            echo "legacy-cron-retirement-targets=${legacy_cron_retirement_targets}"
            echo "notes<<${notes_delimiter}"
            echo "$INPUT_NOTES"
            echo "${notes_delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate deploy runner contracts
        run: pnpm deploy:runner:check

      - name: Validate Tencent COS upload configuration
        shell: bash
        env:
          TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
          DEPLOY_REQUEST_SIGNING_KEY: ${{ secrets.DEPLOY_REQUEST_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$TENCENT_COS_SECRET_ID" || -z "$TENCENT_COS_SECRET_KEY" || -z "$DEPLOY_REQUEST_SIGNING_KEY" ]]; then
            echo "TENCENT_COS_SECRET_ID, TENCENT_COS_SECRET_KEY, and DEPLOY_REQUEST_SIGNING_KEY are required in the production environment." >&2
            exit 2
          fi

      - name: Create legacy cron retirement request
        run:
          node tools/deploy/create-deploy-request.mjs --output
          dist/deploy-requests/request.json
        env:
          DEPLOY_COMMIT_SHA: ${{ steps.resolve.outputs.release-sha }}
          DEPLOY_RUNTIME_SHA: ${{ steps.resolve.outputs.release-sha }}
          DEPLOY_RUNTIME_ARTIFACT_PROFILE: huabaosi-production
          DEPLOY_BUNDLE_SHA: ${{ steps.resolve.outputs.release-sha }}
          DEPLOY_RELEASE_SHA: ${{ steps.resolve.outputs.release-sha }}
          DEPLOY_RELEASE_SCOPE: production-legacy-cron-retirement
          DEPLOY_RESTART_TARGETS: qintopia-system-services
          DEPLOY_DRY_RUN: "false"
          DEPLOY_ROLLBACK_ON_SMOKE_FAILURE: "false"
          DEPLOY_LEGACY_CRON_RETIREMENT_TARGETS:
            ${{ steps.resolve.outputs.legacy-cron-retirement-targets }}
          DEPLOY_NOTES: ${{ steps.resolve.outputs.notes }}
          GITHUB_ACTOR: ${{ github.actor }}
          TENCENT_COS_BUCKET: ${{ env.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ env.TENCENT_COS_REGION }}
          DEPLOY_REQUEST_SIGNING_KEY: ${{ secrets.DEPLOY_REQUEST_SIGNING_KEY }}
          DEPLOY_REQUEST_SIGNING_KEY_ID: production

      - name: Upload legacy cron retirement request to Tencent COS
        run:
          deploy/runner/upload-deploy-request.sh --request-file
          dist/deploy-requests/request.json
        env:
          TENCENT_COS_BUCKET: ${{ env.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ env.TENCENT_COS_REGION }}
          TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
          TENCENT_COS_ENDPOINT: ${{ env.TENCENT_COS_ENDPOINT }}

      - name: Wait for server legacy cron retirement result
        if: ${{ env.WAIT_FOR_SERVER_DEPLOY_RESULT == 'true' }}
        run:
          deploy/runner/wait-deploy-result.sh --request-file
          dist/deploy-requests/request.json
        env:
          TENCENT_COS_BUCKET: ${{ env.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ env.TENCENT_COS_REGION }}
          TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
          TENCENT_COS_ENDPOINT: ${{ env.TENCENT_COS_ENDPOINT }}
          DEPLOY_RESULT_TIMEOUT_SECONDS:
            ${{ vars.DEPLOY_RESULT_TIMEOUT_SECONDS || '900' }}
          DEPLOY_RESULT_POLL_SECONDS: ${{ vars.DEPLOY_RESULT_POLL_SECONDS || '15' }}

      - name: Upload legacy cron retirement request audit artifact
        uses: actions/upload-artifact@v7
        with:
          name: qintopia-agent-os-legacy-cron-retirement-request
          path: dist/deploy-requests/request.json
          retention-days: 30
          if-no-files-found: error
